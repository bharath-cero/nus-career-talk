<meta charset="utf-8">
<title>Career Map, Not Career Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  :root {
    color-scheme: light;
    --paper:    #F7F3EB;
    --card:     #FDFAF4;
    --secondary:#EBE7DF;
    --ink:      #1F1915;
    --muted:    #5C534D;
    --line:     #D6D0C9;
    --pine:     #005C41;
    --pine-mid: #008760;
    --mint:     #D3E2DB;
    --ochre:    #C68956;
    --brick:    #AC312C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #viewport { position: fixed; inset: 0; background: var(--paper); display: grid; place-items: center; }

  #stage {
    position: relative;
    width: 1280px; height: 720px;
    transform-origin: center center;
    background: var(--paper);
    overflow: hidden;
  }

  .eyebrow, .index {
    position: absolute;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow { top: 46px; left: 74px; }
  .eyebrow b { color: var(--pine); font-weight: 500; }
  .index { bottom: 44px; right: 74px; font-variant-numeric: tabular-nums; }
  .index i { font-style: normal; color: var(--line); }

  #hair { position: absolute; left: 74px; right: 74px; top: 78px; height: 1px; background: var(--line); }

  .slide { position: absolute; inset: 118px 74px 86px 74px; display: flex; flex-direction: column; justify-content: center; }
  .slide.top { justify-content: flex-start; }

  /* progressive reveal */
  [data-step] { opacity: 0; transform: translateY(9px); transition: opacity .42s ease, transform .42s cubic-bezier(.2,.75,.25,1); }
  [data-step].shown { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    [data-step] { transition: none; }
  }

  h1, h2, .stmt, .disp {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    margin: 0; text-wrap: balance; font-weight: 700;
    letter-spacing: -.015em;
  }
  h1 { font-size: 68px; line-height: 1.04; }
  h2 { font-size: 46px; line-height: 1.1; }
  .stmt { font-size: 38px; line-height: 1.16; }
  .huge { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 106px; line-height: .88; letter-spacing: -.03em; color: var(--pine); }

  p { font-size: 21px; line-height: 1.55; margin: 0; color: var(--muted); max-width: 34em; }
  p.lead { font-size: 24px; color: var(--ink); }
  .pine { color: var(--pine); }
  .brick { color: var(--brick); }

  .lbl {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--pine);
  }
  .stack { display: flex; flex-direction: column; gap: 26px; }
  .stack.sm { gap: 16px; }
  .row { display: flex; gap: 54px; }
  .row.mid { align-items: center; }

  hr.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

  /* qr */
  .qrbox { width: 168px; }
  .qrbox svg { width: 168px; height: 168px; display: block; border: 1px solid var(--line); border-radius: 6px; }
  .qrbox .cap { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .1em; color: var(--muted); margin-top: 9px; line-height: 1.6; text-transform: uppercase; }
  .qrbox.mini { width: 72px; }
  .qrbox.mini svg { width: 72px; height: 72px; border-radius: 4px; }
  .qrbox.mini .cap { font-size: 8.5px; line-height: 1.35; margin-top: 5px; }
  .qrph {
    width: 210px; height: 210px; border: 2px dashed var(--pine); border-radius: 6px;
    display: grid; place-items: center; text-align: center; background: var(--card);
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--pine); line-height: 2;
  }

  /* hustle anecdotes */
  .anec { display: grid; grid-template-columns: 28px 1fr 156px; gap: 18px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line); }
  .anec .n { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--pine); padding-top: 6px; }
  .anec .t { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 23px; line-height: 1.2; color: var(--ink); }
  .anec .d { font-size: 16.5px; line-height: 1.42; color: var(--muted); margin-top: 5px; }
  .anec .c { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .06em; color: var(--pine-mid); text-align: right; padding-top: 8px; line-height: 1.7; }

  /* learning questions */
  .qq { display: flex; gap: 16px; align-items: baseline; }
  .qq .m { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--pine); flex: none; padding-top: 7px; }
  .qq .x { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 23px; line-height: 1.22; color: var(--ink); }

  .note { background: var(--card); border-left: 3px solid var(--ochre); padding: 13px 18px; }
  .note .h { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ochre); margin-bottom: 7px; }
  .note .b { font-size: 17.5px; line-height: 1.42; color: var(--ink); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px 16px; }
  .panel .ph { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

  .fig { width: 100%; display: block; }
  svg text { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .serifsvg { font-family: "Fraunces", Georgia, serif !important; }
  .flagsvg { font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif !important; }

  /* overlays */
  #notes {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 44vh; overflow-y: auto;
    background: var(--card); border-top: 2px solid var(--pine);
    padding: 16px 30px 20px; display: none; z-index: 40;
    box-shadow: 0 -14px 34px rgba(31,25,21,.10);
  }
  #notes.on { display: block; }
  #notes .nh { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--pine); margin-bottom: 8px; }
  #notes .nb { font-size: 15px; line-height: 1.62; color: var(--ink); max-width: 108ch; }
  #notes .nb em { color: var(--pine); font-style: normal; font-weight: 600; }
  #notes .nb b { color: var(--brick); font-weight: 600; }

  #grid { position: fixed; inset: 0; background: var(--paper); padding: 30px; overflow-y: auto; display: none; z-index: 50; }
  #grid.on { display: block; }
  #grid .gh { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  #gridwrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .thumb {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 5px; padding: 14px 16px; cursor: pointer; text-align: left; color: var(--ink);
    font-family: inherit; display: flex; flex-direction: column; gap: 7px; min-height: 88px;
  }
  .thumb:hover, .thumb:focus-visible { border-color: var(--pine); outline: none; }
  .thumb.cur { border-left-color: var(--pine); background: var(--mint); }
  .thumb .tn { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .thumb .tt { font-family: "Fraunces", Georgia, serif; font-size: 17px; font-weight: 700; line-height: 1.2; }
  .thumb .tm { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; color: var(--pine); letter-spacing: .08em; }

  #hud {
    position: fixed; top: 12px; right: 16px; z-index: 45;
    display: flex; gap: 10px; align-items: center;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--muted);
  }
  #clock { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  #clock.run { color: var(--pine); font-weight: 500; }
  #hud button {
    font: inherit; letter-spacing: .1em; text-transform: uppercase;
    background: var(--card); color: var(--muted); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 9px; cursor: pointer;
  }
  #hud button:hover, #hud button:focus-visible { color: var(--pine); border-color: var(--pine); outline: none; }

  #help {
    position: fixed; bottom: 10px; left: 16px; z-index: 45;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: .08em; color: var(--muted); opacity: .55;
  }
  #dots { position: absolute; bottom: 44px; left: 74px; display: flex; gap: 6px; align-items: center; }
  #dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--line); display: block; }
  #dots i.on { background: var(--pine); border-color: var(--pine); }

  /* intro slide */
  .bigname {
    font-family: "Fraunces", Georgia, serif; font-weight: 800;
    font-size: 108px; line-height: .95; letter-spacing: -.038em; color: var(--ink);
  }
  .role { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 29px; color: var(--pine); line-height: 1.15; }
  .badge {
    display: inline-flex; align-items: center; gap: 9px; align-self: flex-start;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 15px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .wm { font-family: "Inter Tight", "Helvetica Neue", sans-serif; font-weight: 700; letter-spacing: -.012em; }
  .brands { font-family: "Inter Tight", sans-serif; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
  .brand-logo { display: block; width: auto; max-width: 100%; height: auto; }
  .brand-logo.dh-main { width: 210px; }
  .vr { width: 1px; background: var(--line); align-self: stretch; }
  #notes .src { color: var(--muted); font-size: 12px; }
</style>

<div id="viewport">
  <div id="stage">
    <div id="hair"></div>
    <div class="eyebrow" id="eyebrow"></div>
    <div class="index" id="idx"></div>
    <div id="dots"></div>
    <div class="slide" id="slide"></div>
  </div>
</div>

<div id="hud">
  <span id="clock">00:00</span>
  <button id="btimer" type="button" title="Start / pause (T)">Timer</button>
  <button id="bnotes" type="button" title="Notes (N)">Notes</button>
  <button id="bgrid" type="button" title="All slides (O)">Slides</button>
</div>

<div id="help">→ next beat · ← back · O all slides · N notes · T timer · F fullscreen</div>

<div id="notes"><div class="nh" id="nh"></div><div class="nb" id="nb"></div></div>

<div id="grid">
  <div class="gh" id="gh">Act I — click to jump · Esc to close</div>
  <div id="gridwrap"></div>
</div>

        '</div>' +
      '</div>',
    notes: "The three questions are the practical core of Act I &mdash; slow down. Stress that &ldquo;manifesting a change&rdquo; usually means a new project, a transfer, a different manager, a side thing &mdash; not a resignation. Question 2 is the one that surprises people: <em>if you're the most interesting person in your own week, that's a warning, not a compliment.</em> The chart is the principle, and the caveat matters in this room &mdash; a lot of them have visa constraints you never had, so give them the &ldquo;take the intercept, then work the slope&rdquo; version with warmth. <b>The price box is from your own writing and it buys you more credibility than anything else on the slide</b> &mdash; don't soften it."
  });

  /* ───────────────────────── 6 · CLOSE ───────────────────────── */
  S.push({
    act: "Act I", wp: "Why it matters now", title: "Why this matters more now", min: 1,
    html:
      '<div class="stack" style="gap:30px">' +
        '<div class="lbl">Closing Act I</div>' +
        '<h2 data-step="1" style="font-size:49px;line-height:1.08;max-width:21em">AI makes answers abundant.<br><span class="pine">Judgment becomes the constraint.</span></h2>' +
        '<div data-step="2" style="border-left:4px solid var(--ochre);padding:4px 0 4px 26px">' +
          '<div class="lbl" style="color:var(--ochre);margin-bottom:10px">What judgment means</div>' +
          '<div class="stmt" style="font-size:32px;line-height:1.22">Frame the right problem.<br>Connect the context.<br>Choose what matters.</div>' +
        '</div>' +
        '<div data-step="3" style="display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px">' +
          '<div class="stmt" style="font-size:31px">A varied career map is how you <span class="pine">train that judgment.</span></div>' +
          '<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre);white-space:nowrap">Now &mdash; brass tacks &nbsp;&rarr;</div>' +
        '</div>' +
      '</div>',
    notes: "The scarce thing is now explicit: judgment. Define it in practical terms &mdash; framing the right problem, connecting context across domains, and deciding what matters enough to act on. AI makes generating answers cheaper; it does not remove the need to choose the question or evaluate the answer. A varied career map trains those muscles because you repeatedly enter unfamiliar contexts and learn what transfers. Land the last line, pause, then move into Act II: what this looks like inside a real business right now."
  });

  /* ───────────────────────── engine ───────────────────────── */
  var stage = document.getElementById("stage");
  var slideEl = document.getElementById("slide");
  var eyebrowEl = document.getElementById("eyebrow");
  var idxEl = document.getElementById("idx");
  var dotsEl = document.getElementById("dots");
  var notesEl = document.getElementById("notes");
  var nhEl = document.getElementById("nh");
  var nbEl = document.getElementById("nb");
  var gridEl = document.getElementById("grid");
  var gridWrap = document.getElementById("gridwrap");
  var clockEl = document.getElementById("clock");

  var i = 0, step = 0, maxStep = 0;

  function fit() {
    stage.style.transform = "scale(" + Math.min(window.innerWidth / 1280, window.innerHeight / 720) + ")";
  }

  function paintSteps() {
    var els = slideEl.querySelectorAll("[data-step]");
    for (var k = 0; k < els.length; k++) {
      var s = parseInt(els[k].getAttribute("data-step"), 10);
      if (s <= step) els[k].classList.add("shown");
      else els[k].classList.remove("shown");
    }
    dotsEl.innerHTML = "";
    if (maxStep > 0) {
      for (var d = 1; d <= maxStep; d++) {
        var b = document.createElement("i");
        if (d <= step) b.className = "on";
        dotsEl.appendChild(b);
      }
    }
  }

  function render(startAtEnd) {
    var d = S[i];
    slideEl.innerHTML = d.html;
    var els = slideEl.querySelectorAll("[data-step]");
    maxStep = 0;
    for (var k = 0; k < els.length; k++) {
      maxStep = Math.max(maxStep, parseInt(els[k].getAttribute("data-step"), 10));
    }
    step = startAtEnd ? maxStep : 0;
    eyebrowEl.innerHTML = "<b>" + d.act + "</b> &nbsp;·&nbsp; " + d.wp;
    idxEl.innerHTML = (i + 1) + " <i>/</i> " + S.length;
    nhEl.innerHTML = "Speaker notes &nbsp;·&nbsp; " + d.title + " &nbsp;·&nbsp; approx " + d.min + " min";
    nbEl.innerHTML = d.notes || "";
    var cur = gridWrap.querySelector(".thumb.cur");
    if (cur) cur.classList.remove("cur");
    var t = gridWrap.children[i];
    if (t) t.classList.add("cur");
    paintSteps();
  }

  function next() {
    if (step < maxStep) { step++; paintSteps(); }
    else if (i < S.length - 1) { i++; render(false); }
  }
  function prev() {
    if (step > 0) { step--; paintSteps(); }
    else if (i > 0) { i--; render(true); }
  }
  function goSlide(n) { i = Math.max(0, Math.min(S.length - 1, n)); render(false); }

  function budget() {
    var t = 0;
    S.forEach(function (d) { t += d.min; });
    document.getElementById("gh").innerHTML =
      "Act I — click to jump · Esc to close &nbsp;&nbsp;|&nbsp;&nbsp; <b style=\"color:var(--pine)\">" +
      t + " min</b> of the 25-minute talk &nbsp;·&nbsp; " + (25 - t) + " min left for Acts II\u2013IV";
  }

  function buildGrid() {
    var frag = document.createDocumentFragment();
    S.forEach(function (d, n) {
      var b = document.createElement("button");
      b.className = "thumb";
      b.type = "button";
      b.innerHTML = '<div class="tn">' + String(n + 1).padStart(2, "0") + " · " + d.act +
        '</div><div class="tt">' + d.title + '</div><div class="tm">~' + d.min + " MIN</div>";
      b.addEventListener("click", function () { goSlide(n); gridEl.classList.remove("on"); });
      frag.appendChild(b);
    });
    gridWrap.appendChild(frag);
  }

  var t0 = null, elapsed = 0, tick = null;
  function paintClock() {
    var s = Math.floor((elapsed + (t0 ? Date.now() - t0 : 0)) / 1000);
    clockEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function toggleTimer() {
    if (t0) { elapsed += Date.now() - t0; t0 = null; clearInterval(tick); tick = null; clockEl.classList.remove("run"); }
    else { t0 = Date.now(); tick = setInterval(paintClock, 500); clockEl.classList.add("run"); }
    paintClock();
  }
  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  document.getElementById("btimer").addEventListener("click", toggleTimer);
  document.getElementById("bnotes").addEventListener("click", function () { notesEl.classList.toggle("on"); });
  document.getElementById("bgrid").addEventListener("click", function () { gridEl.classList.toggle("on"); });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") { next(); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "PageUp") { prev(); e.preventDefault(); }
    else if (k === "ArrowDown") { if (i < S.length - 1) { i++; render(false); } e.preventDefault(); }
    else if (k === "ArrowUp") { if (i > 0) { i--; render(false); } e.preventDefault(); }
    else if (k === "Home") { goSlide(0); }
    else if (k === "End") { goSlide(S.length - 1); }
    else if (k === "Escape") { gridEl.classList.remove("on"); }
    else if (k === "o" || k === "O") { gridEl.classList.toggle("on"); }
    else if (k === "n" || k === "N") { notesEl.classList.toggle("on"); }
    else if (k === "t" || k === "T") { toggleTimer(); }
    else if (k === "f" || k === "F") { fullscreen(); }
  });

  stage.addEventListener("click", function (e) {
    if (e.clientX < window.innerWidth * 0.25) prev(); else next();
  });

  window.addEventListener("resize", fit);
  buildGrid();
  budget();
  fit();
  render(false);
  paintClock();
})();
</script>
